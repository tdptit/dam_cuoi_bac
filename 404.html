<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phùng Bắc &amp; Thu Hà – Thiệp Cưới Online</title>
    <script>
        (function() {
            // Chuyển hướng thông minh cho GitHub Pages khi dùng link dạng /Anh-Tuấn
            var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
            var search = window.location.search;
            var hash = window.location.hash;

            if (path && !path.includes('.')) {
                // Lấy phần tên sau dấu gạch chéo cuối cùng
                var segments = path.split('/');
                var rawSegment = segments[segments.length - 1];
                var name = rawSegment;
                try {
                    name = decodeURIComponent(rawSegment);
                } catch(e) {}
                window.location.replace('/?to=' + encodeURIComponent(name) + (hash ? hash : ''));
            } else {
                window.location.replace('/' + (search ? search : '') + (hash ? hash : ''));
            }
        })();
    </script>
</head>
<body style="background-color: #5d041e; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p style="font-size: 16px;">Đang mở thiệp cưới...</p>
</body>
</html>
